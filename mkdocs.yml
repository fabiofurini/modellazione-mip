site_name: Modellazione MIP · Fabio Furini
site_description: >-
  Modelli di programmazione lineare intera per l'Ingegneria Gestionale:
  costruirli, dimostrarli, stringerli con bound e risolverli con Gurobi.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/modellazione-mip
copyright: >-
  &copy; 2026 Fabio Furini — testi, figure e dati con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice Python con licenza
  <a href="https://github.com/fabiofurini/modellazione-mip/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/vector-polygon
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search

extra:
  social:
    - icon: material/web
      link: https://sites.google.com/view/fabiofurini/home-page
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/laboratorio-ricerca-operativa/
      name: Laboratorio di Ricerca Operativa — il primo corso della serie
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/modellazione-mip/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/mip-modelling/
      lang: en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Modellazione:
      - modellazione.md
      - 1. Che cos'è un modello MIP: modellazione-1.md
      - 2. Logica e variabili binarie: modellazione-2.md
      - 3. Legami fra variabili:
          - legami.md
          - 3.1 Attivazione: legami-01.md
          - 3.2 Costo fisso: legami-02.md
          - 3.3 Lotto minimo: legami-03.md
          - 3.4 Conteggi interi: legami-04.md
          - 3.5 Variabile di massimo: legami-05.md
          - 3.6 Min-max e max-min: legami-06.md
          - 3.7 Valore assoluto: legami-07.md
          - 3.8 Big-M: legami-08.md
          - 3.9 Precedenze: legami-09.md
          - 3.10 Se e solo se: legami-10.md
          - 3.11 Contare i tipi: legami-11.md
          - 3.12 Alldiff ed espansione: legami-12.md
          - 3.13 Vincoli violabili: legami-13.md
          - 3.14 Funzioni a tratti: legami-14.md
      - 4. Rilassamenti, dualità e bound: modellazione-4.md
      - 5. Euristiche costruttive: modellazione-5.md
      - 6. Dal modello a Python/Gurobi: modellazione-6.md
  - I problemi:
